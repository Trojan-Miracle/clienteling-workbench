<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="830" viewBox="0 0 1120 830" role="img" aria-labelledby="title"><title id="title">VIREL 回复生成架构</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#577564"/></marker></defs><rect width="1120" height="830" fill="#f5f5ef"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#233c31"><text x="48" y="52" font-size="28">VIREL · 回复如何生成</text><rect x="40" y="88" width="320" height="112" rx="10" fill="#fffefa" stroke="#ced9ca"/><text x="60" y="122" font-size="19">客户关系</text><text x="60" y="150" font-size="14" fill="#64786c">对话、订单与服务、客户记忆</text><text x="60" y="174" font-size="14" fill="#64786c">保留角色、时间和来源</text><rect x="400" y="88" width="320" height="112" rx="10" fill="#fffefa" stroke="#ced9ca"/><text x="420" y="122" font-size="19">顾问输入</text><text x="420" y="150" font-size="14" fill="#64786c">本次目的、修改意见、确认事项</text><text x="420" y="174" font-size="14" fill="#64786c">可编辑的个人与客户沟通要求</text><rect x="760" y="88" width="320" height="112" rx="10" fill="#fffefa" stroke="#ced9ca"/><text x="780" y="122" font-size="19">品牌与商品</text><text x="780" y="150" font-size="14" fill="#64786c">品牌语气、商品规格与价格</text><text x="780" y="174" font-size="14" fill="#64786c">服务政策、活动信息</text><path d="M200 200V220H560V244" fill="none" stroke="#577564" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M560 200V244" fill="none" stroke="#577564" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M920 200V220H560V244" fill="none" stroke="#577564" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="180" y="248" width="760" height="100" rx="10" fill="#fffefa" stroke="#ced9ca"/><text x="200" y="282" font-size="19">组装本次上下文</text><text x="200" y="310" font-size="14" fill="#64786c">有效事实和明确要求直接提供；相关历史与例子按需检索</text><text x="200" y="334" font-size="14" fill="#64786c">SQLite保存原文与来源，本地语义向量结合关键词检索</text><path d="M560 348V387" fill="none" stroke="#577564" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="180" y="392" width="760" height="100" rx="10" fill="#fffefa" stroke="#ced9ca"/><text x="200" y="426" font-size="19">确定沟通目的与时机</text><text x="200" y="454" font-size="14" fill="#64786c">新消息或到期事项触发判断：联系、延后、不联系或待核实</text><text x="200" y="478" font-size="14" fill="#64786c">顾问明确要求起草或改写时，执行本次要求</text><path d="M560 492V514H200V544" fill="none" stroke="#577564" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="40" y="550" width="320" height="118" rx="10" fill="#fffefa" stroke="#ced9ca"/><text x="60" y="584" font-size="19">生成模型</text><text x="60" y="612" font-size="14" fill="#64786c">三条中文微信候选</text><text x="60" y="636" font-size="14" fill="#64786c">提供推荐及理由</text><rect x="400" y="550" width="320" height="118" rx="10" fill="#fffefa" stroke="#ced9ca"/><text x="420" y="584" font-size="19">程序检查与模型审查</text><text x="420" y="612" font-size="14" fill="#64786c">格式、事实、联系范围与表达</text><text x="420" y="636" font-size="14" fill="#64786c">发现问题最多修正一次</text><rect x="760" y="550" width="320" height="118" rx="10" fill="#fffefa" stroke="#ced9ca"/><text x="780" y="584" font-size="19">顾问决定</text><text x="780" y="612" font-size="14" fill="#64786c">采用、编辑、重写或复制</text><text x="780" y="636" font-size="14" fill="#64786c">不自动发送</text><path d="M360 608H395" fill="none" stroke="#577564" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M720 608H755" fill="none" stroke="#577564" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M920 668V690H560V713" fill="none" stroke="#577564" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="180" y="718" width="760" height="84" rx="10" fill="#fffefa" stroke="#ced9ca"/><text x="200" y="752" font-size="19">保存结果，供后续使用</text><text x="200" y="780" font-size="14" fill="#64786c">保存实际上下文、草稿和选择；表达例子与业务事实分开</text></g></svg>